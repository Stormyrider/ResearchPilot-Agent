        .gradient-text {
            background: linear-gradient(135deg, #1a3a5c 0%, #2d7d6a 100%);

            width: 8px;

            background: #b0b8c8;

        }

            background: #f0f2f6;

        }
        ::-webkit-scrollbar-thumb:hover {
            background: #b0b8c8;
        }

        /* Selection */
        ::selection {
            background: #1a3a5c;
            color: #fff;
        }
    </style>

        const DEFAULT_CHAT_RESPONSE = 'Thanks for your question! Our team typically addresses this during our AI Strategy Call. Would you like to book one?';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  HOOKS (unchanged)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function useScrollReveal() {
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        }
                    });
                }, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });
                document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, []);
        }

        function useCounter(target, duration = 2000, start = 0) {
            const [value, setValue] = useState(start);
            const ref = useRef(null);
            const hasAnimated = useRef(false);

            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && !hasAnimated.current) {
                            hasAnimated.current = true;
                            const steps = 60;
                            const increment = (target - start) / steps;
                            let current = start;
                            const interval = duration / steps;
                            const timer = setInterval(() => {
                                current += increment;
                                if ((increment > 0 && current >= target) || (increment < 0 && current <=
                                    target)) {
                                    setValue(target);
                                    clearInterval(timer);
                                } else {
                                    setValue(Math.round(current));
                                }
                            }, interval);
                            return () => clearInterval(timer);
                        }
                    });
                }, { threshold: 0.3 });
                observer.observe(el);
                return () => observer.disconnect();
            }, [target, duration, start]);

            return [value, ref];
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  COMPONENTS (unchanged except FAQChatbot)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// ─── FULL-WIDTH FAQ CHATBOT (CONNECTED TO BACKEND) ───
function FAQChatbot() {
const [messages, setMessages] = useState([
{ sender: 'ai', text: 'Hi there! 👋 I\'m ResearchPilot\'s AI assistant. Ask me anything about our services.' }
]);
const [input, setInput] = useState('');
const [isTyping, setIsTyping] = useState(false);
const [loading, setLoading] = useState(false);
const messagesEndRef = useRef(null);

const sendMessage = async (text) => {
if (!text.trim() || loading) return;

const userMsg = { sender: 'user', text: text.trim() };
setMessages(prev => [...prev, userMsg]);
setInput('');
setLoading(true);
setIsTyping(true);

try {
const response = await fetch('/chat', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ question: text.trim() })
});

if (!response.ok) {
throw new Error(`Server error: ${response.status}`);
}

const data = await response.json();
const reply = data.answer || 'Sorry, I did not get a proper response.';

setMessages(prev => [...prev, { sender: 'ai', text: reply }]);
} catch (error) {
console.error('Chat error:', error);
setMessages(prev => [...prev, { sender: 'ai', text: '⚠️ Error: Could not reach the AI agent. Please try again later.' }]);
} finally {
setIsTyping(false);
setLoading(false);
}
};

useEffect(() => {
messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
}, [messages]);

return (
<section className="py-16 md:py-24 bg-white border-t border-[#f0f2f6]" id="faq-chatbot">

<div className="text-center max-w-2xl mx-auto mb-8 reveal">
